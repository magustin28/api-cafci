name: Descarga diaria CAFCI

# Cron externo que dispara la descarga en la API y VERIFICA que la planilla del día haya
# quedado cargada. Existe porque el cron interno corre dentro del proceso de Render: si el
# servicio está suspendido o Render lo reinicia justo antes de las 22:30, ese día se pierde
# en silencio. Acá, si algo falla, el job falla y GitHub avisa por mail.
#
# 22:40 ART (UTC-3) = 01:40 UTC del día siguiente. En UTC, de martes a sábado = de lunes a
# viernes en Argentina.
on:
  schedule:
    - cron: "40 1 * * 2-6"
  workflow_dispatch: {} # para dispararlo a mano desde la pestaña Actions

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar la descarga (POST /api/descargar)
        run: |
          set -euo pipefail
          url="https://api-cafci-x8m6.onrender.com/api/descargar"
          # Disparo manual = modo seco (?dry=1): prueba todo el camino sin escribir en la base
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            url="$url?dry=1"
          fi
          resp=$(curl -sS -X POST "$url" \
            -w '\n%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::La descarga falló (HTTP $code): $body"
            exit 1
          fi

      - name: Verificar que la base esté al día con el archivo publicado
        run: |
          set -euo pipefail
          api="https://api-cafci-x8m6.onrender.com"
          # La fecha REAL de la planilla publicada ahora mismo (modo seco: descarga y parsea sin
          # escribir). NO se compara contra "hoy": si este job corre tarde (GitHub puede demorar
          # el schedule horas) o si es feriado, la planilla publicada sigue siendo la del último
          # día hábil y eso es correcto. Lo que no puede pasar es que la base quede ATRÁS.
          # Corre también en workflow_dispatch: el modo seco no escribe nada, así que el chequeo
          # se puede probar a mano desde la pestaña Actions.
          dry=$(curl -sS -X POST "$api/api/descargar?dry=1" \
            -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}")
          # Si la descarga falló, el cuerpo trae ok:false y una fecha de relleno (fechaHoy): no
          # sirve para comparar, así que se corta acá en vez de dar un resultado engañoso.
          if [ "$(printf '%s' "$dry" | jq -r '.ok')" != "true" ]; then
            echo "::error::El modo seco falló, no se puede verificar: $dry"
            exit 1
          fi
          archivo=$(printf '%s' "$dry" | jq -r '.fecha')
          ultima=$(curl -sS "$api/health/db" | jq -r '.ultimaFecha')
          # /api/descargar devuelve la clave de la fila, o sea ISO (AAAA-MM-DD, igual que
          # /health/db). OJO: /api/fondos sí devuelve datos.fechaArchivo, que es DD/MM/AA.
          # Se aceptan los dos formatos para que el chequeo no se rompa si la API cambia.
          esperada="$archivo"
          if [[ "$archivo" == */* ]]; then
            IFS="/" read -r dd mm aa <<< "$archivo"
            if [ "${#aa}" -eq 2 ]; then aa="20$aa"; fi
            esperada=$(printf '%s-%s-%s' "$aa" "$mm" "$dd")
          fi
          echo "planilla publicada: $archivo ($esperada)   última en la base: $ultima"
          if [ "$ultima" != "$esperada" ]; then
            echo "::error::La base está atrás: la última planilla guardada es $ultima y la publicada es $esperada"
            exit 1
          fi
